<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <title>Login - Personal Finance Tracker</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; cursor: pointer; }
        .error { color: red; margin-bottom: 15px; }
        .logout { color: green; margin-bottom: 15px; }
        .register-link { text-align: center; margin-top: 15px; }
    </style>
</head>
<body>
<h2>Login</h2>

<div th:if="${param.error}" class="error">
    Invalid username or password.
</div>

<div th:if="${param.logout}" class="logout">
    You have been logged out successfully.
</div>

<form th:action="@{/login}" method="post">
    <div class="form-group">
        <label>Username:</label>
        <input type="text" name="username" />
    </div>
    <div class="form-group">
        <label>Password:</label>
        <input type="password" name="password" />
    </div>
    <button type="submit">Login</button>
</form>

<div class="register-link">
    <a th:href="@{/registration}">Don't have an account? Register</a>
</div>
</body>
</html>
